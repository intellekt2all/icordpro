name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev]

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: icordpro
          POSTGRES_PASSWORD: icordpro
          POSTGRES_DB: icordpro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U icordpro -d icordpro"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://icordpro:icordpro@localhost:5432/icordpro
      API_PORT: 4000
      WEB_PORT: 3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Run database migrations
        run: pnpm db:migrate
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Test
        run: pnpm test
      - name: Smoke test
        run: pnpm smoke:test
