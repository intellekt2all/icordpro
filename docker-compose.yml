services:
  postgres:
    image: postgres:16-alpine
    container_name: icordpro_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: icordpro
      POSTGRES_PASSWORD: icordpro
      POSTGRES_DB: icordpro
    ports:
      - "5432:5432"
    volumes:
      - icordpro_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U icordpro -d icordpro"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  icordpro_pg_data:
